<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FocusAI Admin Analytics</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#0b0b0d;--panel2:#101012;--text:#f5f5f6;--muted:#9b9ba3;--soft:#6f6f78;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--good:#86efac;--bad:#fca5a5;--warn:#fde68a;--r:22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 45% -15%,rgba(255,255,255,.12),transparent 32%),linear-gradient(180deg,#050505,#020202);color:var(--text)}button,input{font:inherit}.shell{min-height:100vh;padding:22px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.sidebar{position:sticky;top:22px;height:calc(100vh - 44px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:38px;height:38px;border-radius:14px;background:url('/assets/focusai-logo.png') center/contain no-repeat,rgba(255,255,255,.05);border:1px solid var(--line)}.brand strong{display:block;letter-spacing:-.04em}.brand span,.muted{color:var(--muted);font-size:13px}.nav{display:grid;gap:8px}.nav a{color:#d8d8de;text-decoration:none;border:1px solid transparent;border-radius:14px;padding:11px 12px;font-size:14px}.nav a:hover,.nav a.active{background:rgba(255,255,255,.055);border-color:var(--line)}.side-footer{position:absolute;left:18px;right:18px;bottom:18px;display:grid;gap:9px}.btn{height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;cursor:pointer;transition:transform .14s ease,border-color .14s ease,background .14s ease}.btn:hover{transform:translateY(-1px);border-color:var(--line2);background:rgba(255,255,255,.07)}.btn.primary{background:#f4f4f5;color:#050505;border-color:#f4f4f5;font-weight:800}.btn.danger{color:#fecaca;border-color:rgba(248,113,113,.22);background:rgba(248,113,113,.07)}.main{min-width:0;display:grid;gap:16px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:7px 10px;color:#d8d8de;font-size:12px}.title h1{margin:12px 0 6px;font-size:clamp(34px,5vw,64px);line-height:.92;letter-spacing:-.07em}.title p{margin:0;color:var(--muted)}.status{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:8px 10px;font-size:12px;color:#d8d8de}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.024));box-shadow:0 18px 60px rgba(0,0,0,.26);padding:16px}.card h2{margin:0 0 5px;font-size:16px;letter-spacing:-.02em}.card p{margin:0;color:var(--muted);font-size:13px}.kpi span{color:var(--muted);font-size:12px}.kpi strong{display:block;margin-top:9px;font-size:31px;letter-spacing:-.06em}.kpi small{color:var(--soft)}.layout{grid-template-columns:1.28fr .72fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.chart{height:250px;display:flex;align-items:end;gap:9px;overflow-x:auto;padding:14px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.07);margin-top:12px}.day{min-width:54px;text-align:center}.bars{height:160px;display:flex;align-items:end;justify-content:center;gap:4px}.bar{width:10px;min-height:5px;border-radius:999px;background:#f5f5f6}.bar.messages{opacity:.68}.bar.responses{opacity:.42}.day small{display:block;color:var(--soft);font-size:11px;margin-top:7px}.list{display:grid;gap:10px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.075);background:rgba(0,0,0,.18);border-radius:16px;padding:12px}.row strong{font-size:14px}.row span,.row small{color:var(--muted);font-size:12px}.meter{height:8px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;margin-top:8px}.meter div{height:100%;background:#f5f5f6;border-radius:inherit}.table-wrap{overflow:auto;margin-top:12px;border:1px solid rgba(255,255,255,.075);border-radius:18px}table{width:100%;border-collapse:collapse;min-width:880px}th,td{text-align:left;padding:12px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;vertical-align:top}th{position:sticky;top:0;background:#111114;color:#b7b7bd;font-weight:700}td{color:#e5e5e8}td.muted-cell{color:var(--muted)}code{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);padding:3px 6px;border-radius:9px}.empty,.loading,.error{padding:18px;border-radius:18px;border:1px dashed rgba(255,255,255,.16);color:var(--muted);background:rgba(255,255,255,.025)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.nowrap{white-space:nowrap}.search{height:40px;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:13px;color:var(--text);padding:0 12px;width:260px;max-width:100%;outline:none}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}@media(max-width:1150px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.side-footer{position:static;margin-top:20px}.kpis{grid-template-columns:repeat(2,1fr)}.layout,.three{grid-template-columns:1fr}.topbar{display:grid}.status{justify-content:flex-start}}@media(max-width:640px){.shell{padding:12px}.kpis{grid-template-columns:1fr}.card{padding:14px}.title h1{font-size:38px}}
  </style>
</head>
<body>
  <div id="app"><main class="shell"><section class="loading">Loading analytics…</section></main></div>
  <script src="/admin/assets/dashboard.js" defer></script>
</body>
</html>
